# CD – Build et push automatique des images Docker sur Docker Hub
# Déclencheur : push sur main
# Ce workflow :
#   1. Clone le code
#   2. Configure Docker Buildx
#   3. Se connecte à Docker Hub via les secrets GitHub
#   4. build et push l'image backend avec 2 tags :
#      - latest      → dernière version stable
#      - github.sha  → hash du commit pour traçabilité
#   5. Build et push l'image frontend avec les mêmes tags
#   6 Utilise le cache Docker pour optimiser les builds

name: FastIA – CD Docker Hub

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    name: Build & Push images Docker
    runs-on: ubuntu-latest

    steps:
      # checkout du code
      - name: Checkout du code
        uses: actions/checkout@v3

      #conf Docker Buildx
      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Connexion to docker hub
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # cache Docker layers
      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # build et push image backend
      - name: Build & Push – Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fastia-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/fastia-backend:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # build et push image front
      - name: Build & Push – Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fastia-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/fastia-frontend:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotation du cache Docker
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # résumé 
      - name: Images publiées
        run: |
          echo "Backend  : docker pull ${{ secrets.DOCKER_USERNAME }}/fastia-backend:latest"
          echo "Frontend : docker pull ${{ secrets.DOCKER_USERNAME }}/fastia-frontend:latest"
          echo "Tag commit : ${{ github.sha }}"